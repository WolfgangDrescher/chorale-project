name: Build

# The tests run for every push and pull request. Only a push to master that
# passes them pushes the images of the two services to ghcr.io, tagged with the
# short commit hash (sha-3f9a1c2) and latest.
on:
    push:
        branches:
            - master
    pull_request: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Builds the C++ tools and runs the test suite of chorale-search.
            - name: Test
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: test
                  cache-from: type=gha,scope=toolchain
                  cache-to: type=gha,scope=toolchain,mode=max

    images:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                target: [tools, webapp]
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  submodules: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to ghcr.io
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image tags
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/wolfgangdrescher/chorale-project-${{ matrix.target }}
                  tags: |
                      type=sha,format=short
                      type=raw,value=latest

            - name: Build and push ${{ matrix.target }} image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: ${{ matrix.target }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: |
                      type=gha,scope=toolchain
                      type=gha,scope=${{ matrix.target }}
                  cache-to: type=gha,scope=${{ matrix.target }},mode=max
