# The reverse proxy on the host, in front of the webapp container (compose.yaml
# publishes it on 127.0.0.1:3000). Put it in /etc/nginx/conf.d/ or
# sites-available/ and add TLS, e.g. with certbot.
server {
    listen 80;
    server_name chorales.example.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The search and the segmentation answer as a stream of progress events
    # (application/x-ndjson), which the page shows while the tool runs. The app
    # asks nginx not to hold it back with X-Accel-Buffering, this makes sure of
    # it. A tool is stopped after 10 seconds, long before the default read
    # timeout of 60 seconds.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A score can be up to 2 MB, plus the JSON around it.
        client_max_body_size 3m;
    }
}
