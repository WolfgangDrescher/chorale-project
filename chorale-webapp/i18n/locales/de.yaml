checkListTitle: Das wird geprüft
checkParallelMotion: Quint- und Oktavparallelen
checkParallelMotionDescription: "Zwei Stimmen bewegen sich in dieselbe Richtung und bilden zweimal hintereinander eine reine Quinte oder Oktave. Das wird zwischen allen Stimmenpaaren geprüft, aufwärts und abwärts. Zusammengesetzte Intervalle zählen mit, eine Duodezime also als Quinte, ein Einklang als Oktave. Liegende Töne, Gegenbewegung und verminderte Quinten sind keine Parallelen. Beide Stimmen müssen ihre Noten gleichzeitig anschlagen."
checkHiddenMotion: Verdeckte Quinten und Oktaven
checkHiddenMotionDescription: "Bass und Sopran bewegen sich in dieselbe Richtung und erreichen dabei eine reine Quinte oder Oktave. Ob der Sopran sie im Schritt erreichen darf, kann mit dem Schalter festgelegt werden."
checkVoiceCrossing: Stimmkreuzung
checkVoiceCrossingDescription: "Tenor, Alt oder Sopran haben einen tieferen Ton als der Bass. Gemeldet wird nur die Stelle, an der die Kreuzung beginnt. Ein gleicher Ton wie im Bass zählt nicht."
checkLargeLeaps: Große Sprünge
checkLargeLeapsDescription: "Erlaubt sind Sprünge bis zur Quinte, die kleine Sexte nur aufwärts und die Oktave. Alles andere wird gemeldet, auch die große Sexte."
checkBassPhraseEnd: "Kadenzbass"
checkBassPhraseEndDescription: "Der Bass sollte den Ton unter einer Fermate mit einem Quint- oder Quartschritt erreichen, aufwärts oder abwärts, also als Bassklausel oder als plagale Kadenz. Jede andere Bewegung wird gemeldet, auch bei einem Halbschluss."
checkVoiceRange: Stimmumfang
voiceRanges: Stimmumfang nach
voiceRangesDescription: Die Umfänge, an denen die Töne jeder Stimme gemessen werden.
voiceRangesStraussBerlioz: Strauss/Berlioz
voiceRangesStraussBerliozDescription: "Bass F bis es', Tenor c bis b', Alt f bis es'' und Sopran c' bis b'', wie in der Instrumentationslehre von Berlioz und Strauss."
voiceRangesBach: Bach
voiceRangesBachDescription: "Bass C bis e', Tenor c bis a', Alt e bis d'' und Sopran a bis a'', gemessen an den 370 Chorälen von Bach."
checkVoiceRangeDescription: "Jede Stimme wird auf ihren üblichen Umfang geprüft. Noten außerhalb davon werden als Hinweis markiert, denn der Umfang ist eine Gewohnheit der Stimmen und keine strenge Regel. Gemessen wird nach Strauss/Berlioz oder Bach."
