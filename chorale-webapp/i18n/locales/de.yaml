bassLines: Häufige Bässe zum c.f. der Segmente anzeigen
bassLinesDescription: "Zeigt zu jedem Segment die fünf häufigsten Bässe, mit denen Bach den c.f. des Segments setzt, als Partiturausschnitt, transponiert auf den Startton des Segments. Die Töne des c.f. müssen metrisch gleich liegen: schwer auf schwer oder halbschwer, im 4/4-Takt auch um einen halben Takt verschoben. Die Einstellungen zu Intervallqualität und unbetonten Notenwerten gelten auch hier."
